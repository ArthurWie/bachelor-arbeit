[project]
name = "library-rag"
version = "0.1.0"
description = "Lokales RAG über eine Zotero-Bibliothek mit prüfbarer Zitierbarkeit"
requires-python = ">=3.11"
dependencies = [
  "docling",
  "sentence-transformers",
  "torch",
  "accelerate",           # Pflicht für device_map beim fp8-Laden
  # fp8 braucht in transformers 5.x einen Matmul-Kernel aus dem Kernel-Hub;
  # der Kernel ist Triton-basiert, und Triton gibt es offiziell nicht für
  # Windows -> der gepflegte Port. Ohne beides: ImportError beim ersten
  # Forward-Pass, NICHT beim Laden. Siehe docs/ABWEICHUNGEN.md Nr. 10.
  "kernels>=0.15.2,<0.16",
  "triton-windows; sys_platform == 'win32'",
  # Fußnoten-Wortlaut wird gegen die PDF-Seite geprüft, nicht gegen den
  # Docling-Text (siehe „Library Tools" in der CLAUDE.md der Arbeit).
  "pdfplumber",
  "sqlite-vec",
  "mcp>=1.0,<2.0",        # v2 benennt FastMCP um -> würde brechen
  "fastapi",
  "uvicorn",
  "httpx",
  "pyyaml",
  "numpy",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library_core", "retrieval_mcp", "api", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
